name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  # Complete regression only by deliberate dispatch; never deploys by itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event_name == 'workflow_dispatch' && 'release-' || '' }}${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select affected tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 scripts/test-ci-affected.py
      - name: Select checks since last green push
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo full=true >> "$GITHUB_OUTPUT"
            echo 'Complete release regression selected deliberately.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then base=$PR_BASE; else
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event push --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          fi
          tests=$(python3 scripts/ci-affected.py "$base" "$GITHUB_SHA")
          echo full=false >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo 'Affected ExUnit files + two smoke files (full regression deferred):' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[]' <<< "$tests" >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: select
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The server's Repo starts during the engine tests; a missing database
          # leaves its pool backing off and starves `ecto.migrate` of a connection.
          POSTGRES_DB: pidro_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install avatar image processor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2"

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            apps/pidro_server/priv/plts
          key: ${{ runner.os }}-otp-29.0.3-elixir-1.20.2-${{ hashFiles('mix.lock') }}

      - run: mix deps.get --only test
      - name: Feature quality and affected tests (complete precommit only on manual release run)
        env:
          FULL: ${{ needs.select.outputs.full }}
          TESTS: ${{ needs.select.outputs.tests }}
        run: |
          if [ "$FULL" = true ]; then
            mix precommit
          else
            mix hex.audit
            mix format --check-formatted
            mix compile --warnings-as-errors
            ops/credo-diff
            mapfile -t tests < <(jq -er '.[]' <<< "$TESTS")
            test "${#tests[@]}" -gt 0
            mix test "${tests[@]}" --raise
          fi

  container:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag pidro-backend:ci .

  deployment-config:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true
      - run: bundle exec kamal config > /dev/null
      - name: Forbid forward_headers in config/deploy.yml
        # Parses the YAML (any nesting, flow or block style, quoted keys) instead
        # of grepping, so no spelling of the key slips past the policy.
        run: |
          ruby -ryaml -e '
            def walk(node, path, hits)
              case node
              when Hash
                node.each do |key, value|
                  child = path + [key.to_s]
                  hits << child.join(".") if key.to_s == "forward_headers"
                  walk(value, child, hits)
                end
              when Array
                node.each_with_index { |value, index| walk(value, path + [index.to_s], hits) }
              end
            end
            hits = []
            walk(YAML.safe_load_file("config/deploy.yml", aliases: true), [], hits)
            unless hits.empty?
              warn "config/deploy.yml must not set forward_headers (found at: #{hits.join(", ")}); see docs/deployment/kamal_hetzner.md"
              exit 1
            end
          '
      - run: bundle exec bundle-audit check --update
      - run: bash -n .kamal/hooks/* ops/backup-production ops/credo-diff ops/install-backup-timer ops/server/pidro-backup ops/smoke-production scripts/rollback

  ready:
    name: Backend ready${{ github.event_name == 'workflow_dispatch' && ' (full)' || '' }}
    needs: [select, quality, container, deployment-config]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every selected job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.select, .quality, .container, .["deployment-config"]; .result == "success")' <<< "$RESULTS"
