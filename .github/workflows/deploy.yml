name: Deploy

# Deliberate release only. Feature pushes never launch full client journeys or deploy.
# Require a green manual/full Backend CI run, then preserve Game/Account guards.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Main commit to release (must have a green manual/full Backend CI run)
        required: true
        default: main

permissions:
  contents: read

jobs:
  candidate:
    name: Require a full-green release candidate
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve candidate and require complete regression
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          sha=$(git rev-parse --verify "$COMMIT^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          full=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event workflow_dispatch --status success --limit 100 --json headSha,url \
            --jq ".[] | select(.headSha == \"$sha\") | .url" | head -1)
          if [ -z "$full" ]; then
            echo 'Run Backend CI manually on this candidate before releasing.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $sha; full regression: $full" >> "$GITHUB_STEP_SUMMARY"

  game-journeys:
    name: Game journeys
    needs: candidate
    concurrency:
      group: deploy-game-journeys
      cancel-in-progress: true
    uses: pidrogame/pidro-frontend/.github/workflows/game-e2e.yml@main
    with:
      backend-sha: ${{ needs.candidate.outputs.sha }}

  account-journeys:
    name: Account journeys
    needs: candidate
    concurrency:
      group: deploy-account-journeys
      cancel-in-progress: true
    uses: pidrogame/pidro-frontend/.github/workflows/account-e2e.yml@main
    with:
      backend-sha: ${{ needs.candidate.outputs.sha }}

  deploy:
    name: Deploy production
    needs: [candidate, game-journeys, account-journeys]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # One deploy at a time. A newer commit replaces one that is waiting here,
    # never one that is running.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ needs.candidate.outputs.sha }}
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      CLASSIC_API_URL: ${{ secrets.CLASSIC_API_URL }}
      CLASSIC_CLAIM_SECRET: ${{ secrets.CLASSIC_CLAIM_SECRET }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      SMTP_RELAY: ${{ secrets.SMTP_RELAY }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # Optional, so it is not in the check below: empty turns translation off.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional too: empty sends pushes without an Expo access token.
      EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
      # Optional too: empty keeps Premium off (nobody is Premium, webhook 503).
      REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
      REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          missing=()
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS KAMAL_REGISTRY_PASSWORD SECRET_KEY_BASE \
            POSTGRES_PASSWORD CLASSIC_API_URL CLASSIC_CLAIM_SECRET FB_APP_SECRET \
            SMTP_RELAY SMTP_PORT SMTP_USERNAME SMTP_PASSWORD; do
            test -n "${!name}" || missing+=("$name")
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            message="Deploy skipped: missing GitHub Actions secrets ${missing[*]}. See docs/deploy.md."
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Load the deploy key and secrets
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # setup-ruby's gem cache lives in the checkout; the pre-build hook must not see it.
          printf '/vendor/bundle/\n/.bundle/\n' >> .git/info/exclude
          mkdir -p ~/.ssh
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          echo "$SSH_PRIVATE_KEY" | ssh-add -
          # Keep multiline credentials on one line through Kamal's env file.
          # Mask the encoded values too; runtime.exs decodes them in memory.
          for name in ASC_PRIVATE_KEY PLAY_SERVICE_ACCOUNT_JSON; do
            encoded="$(printf '%s' "${!name}" | base64 -w 0)"
            if [ -n "$encoded" ]; then echo "::add-mask::$encoded"; fi
            echo "${name}_BASE64=$encoded" >> "$GITHUB_ENV"
          done
          # Kamal expands each $NAME from the next step's environment; this file holds references only.
          for name in KAMAL_REGISTRY_PASSWORD SECRET_KEY_BASE POSTGRES_PASSWORD \
            CLASSIC_API_URL CLASSIC_CLAIM_SECRET FB_APP_SECRET \
            SMTP_RELAY SMTP_PORT SMTP_USERNAME SMTP_PASSWORD ANTHROPIC_API_KEY EXPO_ACCESS_TOKEN \
            REVENUECAT_SECRET_KEY REVENUECAT_WEBHOOK_SECRET \
            ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64 PLAY_SERVICE_ACCOUNT_JSON_BASE64; do
            echo "$name=\$$name"
          done > .kamal/secrets-common

      - name: Deploy (backup, migrate, /up, post-deploy smoke)
        if: steps.secrets.outputs.ready == 'true'
        run: bundle exec kamal deploy

      - name: Verify production runs this commit
        if: steps.secrets.outputs.ready == 'true'
        run: |
          version="$(bundle exec kamal app version --quiet | tr -d '[:space:]')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 https://app.pidro.online/up)"
          echo "Running version: $version (expected $SHA); /up: $status"
          test "$version" = "$SHA"
          test "$status" = "200"
          echo "Deployed $SHA to https://app.pidro.online." >> "$GITHUB_STEP_SUMMARY"
