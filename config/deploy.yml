service: pidro-backend
image: marcelfahle/pidro-backend
minimum_version: 2.12.0
retain_containers: 5
deploy_timeout: 60
drain_timeout: 30

servers:
  web:
    - 95.217.3.224

ssh:
  user: root

proxy:
  # Keep kamal-proxy's forward_headers at its default (off with TLS). The proxy
  # then discards client-supplied X-Forwarded-* headers and writes exactly one
  # trusted X-Forwarded-For value, which PidroServerWeb.Plugs.TrustedProxy
  # reads so rate limits key on the real client. Do not add a forward_headers
  # key here: the deployment-config CI job fails if one appears. See
  # docs/deployment/kamal_hetzner.md.
  host: app.pidro.online
  ssl: true
  app_port: 4000
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: marcelfahle
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: Dockerfile
  remote: ssh://root@95.217.3.224

env:
  clear:
    PHX_SERVER: "true"
    PHX_HOST: "app.pidro.online"
    PORT: "4000"
    POOL_SIZE: "20"
    CORS_ORIGINS: "https://www.pidro.online,https://play.pidro.online,https://app.pidro.online"
    WEB_URL: "https://play.pidro.online"
    MAIL_FROM_ADDRESS: "noreply@pidro.online"
    MAIL_REPLY_TO: "support@pidro.online"
    # Set a minimum only once its store build is live; empty means no notice.
    MINIMUM_NATIVE_ANDROID: "3.2.4"
    NATIVE_STORE_URL_ANDROID: "https://play.google.com/store/apps/details?id=com.oneapps.pidro.beta"
    MINIMUM_NATIVE_IOS: ""
    NATIVE_STORE_URL_IOS: "https://testflight.apple.com/join/2JR95b65"
    # Public launch: replace the beta/TestFlight URLs with the public store listings.
    # Phase 4 privacy disclosure is live and verified on the canonical site.
    DEFERRED_INVITES_ENABLED: "true"
    # Watching tables (PID-389): "true" lists playing tables to watch and lets anyone watch.
    WATCHING_TABLES: "false"
    # Weekly leagues (PID-350): must be a Sunday 19:00 UTC; unset means off.
    LEAGUES_START_AT: "2026-11-01T19:00:00Z"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: pidro_prod
    DB_USER: pidro
    ADMIN_EMAIL: "m.fahle@gmail.com"
  secret:
    - SECRET_KEY_BASE
    - POSTGRES_PASSWORD
    - CLASSIC_API_URL
    - CLASSIC_CLAIM_SECRET
    - FB_APP_SECRET
    - SMTP_RELAY
    - SMTP_PORT
    - SMTP_USERNAME
    - SMTP_PASSWORD
    # Optional: without it /admin/news has no Translate to Swedish.
    - ANTHROPIC_API_KEY
    # Optional read-only store checks; multiline values travel base64-encoded.
    - ASC_KEY_ID
    - ASC_ISSUER_ID
    - ASC_PRIVATE_KEY_BASE64
    - PLAY_SERVICE_ACCOUNT_JSON_BASE64

logging:
  driver: local
  options:
    max-size: "100m"
    max-file: "10"

accessories:
  postgres:
    service: postgres
    image: postgres:18.4@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    host: 95.217.3.224
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: pidro_prod
        POSTGRES_USER: pidro
      secret:
        - POSTGRES_PASSWORD
    directories:
      - postgres18-data:/var/lib/postgresql
