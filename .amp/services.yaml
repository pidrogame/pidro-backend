services:
  postgres:
    command: >-
      v=$(pg_lsclusters --no-header | awk '$2 == "main" {print $1; exit}');
      exec sudo --user=postgres
      /usr/lib/postgresql/$v/bin/postgres
      -D /var/lib/postgresql/$v/main
      -c config_file=/etc/postgresql/$v/main/postgresql.conf
    port: 5432
